#------------------------------------------------------------------------------
# SPEC CPU2026 config — cpu2026
#------------------------------------------------------------------------------

#--------- Label --------------------------------------------------------------
%ifndef %{label}
   label   = maap
%else
   label   = %{label}
%endif

#--------- Preprocessor -------------------------------------------------------
%ifndef %{build_ncpus}
%   define  build_ncpus 8
%endif

%ifndef %{bits}
%   define  bits        64
%endif

# Compiler optimization flag, driven by run_sweep.sh via --define optflag=...
# Tags are mirrored from CPU2017 maap: maap, maapO1, maapO2, maapO3, maapOfast, maapOg.
%ifndef %{optflag}
%   define optflag -O3
%endif

# Single output root. Override per-host with --define maap_out=/some/path.
# SPEC redirects build/run/result trees under %{maap_out}/spec.
# The wrapper logs go under %{maap_out}/monitor_logs via MONITOR_LOG_ROOT
# exported by run_sweep.sh.
%ifndef %{maap_out}
%   define maap_out $HOME/maap_out
%endif

%define    os           LINUX
%if %{bits} == 64
%   define model        -m64
%elif %{bits} == 32
%   define model        -m32
%else
%   error Please define number of bits
%endif


#--------- Monitor hooks ------------------------------------------------------
# command_add_redirect must be on so the wrapper output does not mix with
# benchmark stdout/stderr (which would fail validation).
default:
   command_add_redirect = 1
   monitor_wrapper      = /path/to/collect/monitor_wrapper.sh $command


#--------- Global Settings ----------------------------------------------------
default:
   output_root          = %{maap_out}/spec
   bench_post_setup     = sync
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,pdf,csv
   preenv               = 1
   reportable           = 0
   tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
intrate,fprate:
   copies               = 1
intspeed,fpspeed:
   threads              = 4


#------- Compilers ------------------------------------------------------------
default:
%ifndef %{gcc_dir}
%   define gcc_dir "/usr"
%endif

%define GCCge10

   preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64
   SPECLANG                = %{gcc_dir}/bin/
   CC                      = $(SPECLANG)gcc      -std=c18     %{model}
   CXX                     = $(SPECLANG)g++      -std=c++17   %{model}
   FC                      = $(SPECLANG)gfortran -std=f2018   %{model}
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version


#--------- Portability --------------------------------------------------------
default:
%if %{bits} == 32
   EXTRA_PORTABILITY = -D_FILE_OFFSET_BITS=64
%else
   EXTRA_PORTABILITY = -DSPEC_LP64
%endif

800.pot3d_s:
   PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY     = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs


#-------- GCC workarounds (not PORTABILITY) -----------------------------------
%ifdef %{GCCge10}
default:
   EXTRA_FFLAGS = -fallow-argument-mismatch
%endif


#-------- Tuning Flags --------------------------------------------------------
intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M
doconcurrent:
   EXTRA_FOPTIMIZE = -ftree-parallelize-loops=8
openmp:
   EXTRA_OPTIMIZE  = -fopenmp -DSPEC_OPENMP
cxxthreads:
   EXTRA_OPTIMIZE  = -pthread

default=base:
   OPTIMIZE       = -g %{optflag} -march=native

default:
   basepeak = yes
default=peak:


#------------------------------------------------------------------------------
# Tester / system descriptions — fill in for reportable runs only
#------------------------------------------------------------------------------
default:
   sw_compiler001       = C/C++/Fortran: system GCC
   sw_compiler_category = Community
   sw_base_ptrsize      = 64-bit
   sw_peak_ptrsize      = Not Applicable

   hw_vendor            = Local
   tester               = Local
   test_sponsor         = Local
   license_num          = 0


# (SPEC auto-generated hash/notes block removed; runcpu regenerates it on run.)
