# Sample FeFET settings derived from simulation efforts by Niemier Research Group
# at University of Notre Dame; see README for details

# Basic Cell Properties
MemCellType: FeFET

Area: 10
AspectRatio: 1

# Resistance Values at Different Voltages
Resistance:
  OnAtSetVoltage: 100 KOhm
  OffAtSetVoltage: 1 GOhm
  OnAtResetVoltage: 100 KOhm
  OffAtResetVoltage: 10 MOhm
  On: 1 MOhm
  Off: 10 MOhm
  OnAtHalfResetVoltage: 500 KOhm

# Capacitance
Capacitance:
  On: 100 aF
  Off: 100 aF

# Read Operation
Read:
  Mode: current
  Voltage: 0.05 V
  Power: 0.125 uW

# Reset Operation
Reset:
  Mode: voltage
  Voltage: 3.0 V
  Pulse: 1340 ns
  Energy: 0.00311 pJ

# Set Operation
Set:
  Mode: voltage
  Voltage: 3.0 V
  Pulse: 1340 ns
  Energy: 0.00311 pJ

# Access Device
Access:
  Type: CMOS
  VoltageDrop: 0.01 V
  Width: 0.01

# Additional Properties
ReadFloating: false
