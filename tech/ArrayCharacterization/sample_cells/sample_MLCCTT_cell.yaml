# Sample CTT parameters derived from measured results of Harvard VLSI-Arch Group
# "Fully-CMOS Multi-Level Embedded Non-Volatile Memory Devices With Reliable Long-Term Retention
# for Efficient Storage of Neural Network Weights", S. Ma et al., IEEE Electron Device Letters, 2019

MemCellType: CTT

Area: 8
AspectRatio: 2

Read:
  Mode: current

# Device-Specific Parameters
MultiLevel:
  SenseAmpFingers: 8
  Levels: 16

Access:
  Type: None
