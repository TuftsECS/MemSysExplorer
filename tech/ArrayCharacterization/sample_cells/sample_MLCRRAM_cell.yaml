# Sample MLC RRAM parameters extrapolated from
# "Improved multi-level control of RRAM using pulse-train programming", Zhao et. al., VLSI 2014

# Basic Cell Properties
MemCellType: memristor
MultiLevel:
  Levels: 4
Area: 4
AspectRatio: 1

# Resistance Values at Different Voltages
Resistance:
  OnAtSetVoltage: 100 KOhm
  OffAtSetVoltage: 10 MOhm
  OnAtResetVoltage: 100 KOhm
  OffAtResetVoltage: 10 MOhm
  On: 1 MOhm
  Off: 10 MOhm
  OnAtHalfResetVoltage: 500 KOhm

# Capacitance
Capacitance:
  On: 100 aF
  Off: 100 aF

# Read Operation
Read:
  Mode: current
  Voltage: 0.4 V
  Power: 0.16 uW

# Reset Operation
Reset:
  Mode: voltage
  Voltage: 2.0 V
  Pulse: 10 ns
  Energy: 0.6 pJ

# Set Operation
Set:
  Mode: voltage
  Voltage: 2.0 V
  Pulse: 10 ns
  Energy: 0.6 pJ

# Access Device
Access:
  Type: None
  # Uncomment below if using diode access
  # Type: diode
  # VoltageDrop: 0.5 V

# Additional Properties
ReadFloating: false
