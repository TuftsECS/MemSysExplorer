# SPEC CPU2017 runcpu config for MemSysExplorer collection.
# Compiler flag is injected per tag by run_sweep.sh via --define optflag=...
# Each benchmark run is handed to monitor_wrapper.sh, which re-runs it under
# the chosen profiler (DynamoRIO / Sniper / perf).

%ifndef %{label} %define label maap %endif
%ifndef %{bits}        %define bits 64        %endif
%ifndef %{build_ncpus} %define build_ncpus 4  %endif
%ifndef %{optflag}     %define optflag -O3    %endif
%define os LINUX
%define model -m64

command_add_redirect = 1
monitor_wrapper      = /path/to/collect/monitor_wrapper.sh $command

flagsurl        = $[top]/config/flags/gcc.xml
ignore_errors   = 1
iterations      = 1
label           = %{label}-m%{bits}
makeflags       = --jobs=%{build_ncpus}
output_format   = txt,csv
preenv          = 1
reportable      = 0
tune            = base

#--------- Portability --------------------------------------------------------
default:
    EXTRA_PORTABILITY = -DSPEC_LP64

500.perlbench_r,600.perlbench_s:
    PORTABILITY = -DSPEC_LINUX_X64
521.wrf_r,621.wrf_s:
    CPORTABILITY = -DSPEC_CASE_FLAG
    FPORTABILITY = -fconvert=big-endian
523.xalancbmk_r,623.xalancbmk_s:
    PORTABILITY = -DSPEC_LINUX
526.blender_r:
    PORTABILITY = -funsigned-char -DSPEC_LINUX
527.cam4_r,627.cam4_s:
    PORTABILITY = -DSPEC_CASE_FLAG
628.pop2_s:
    CPORTABILITY = -DSPEC_CASE_FLAG
    FPORTABILITY = -fconvert=big-endian

#--------- CPUs ---------------------------------------------------------------
intrate,fprate:    copies  = 1
intspeed,fpspeed:  threads = 4

#--------- Compilers ----------------------------------------------------------
default:
%ifndef %{gcc_dir}     %define gcc_dir /usr/bin/     %endif
    SPECLANG = %{gcc_dir}
    CC       = $(SPECLANG)gcc  -std=c99 %{model}
    CXX      = $(SPECLANG)g++           %{model}
    FC       = $(SPECLANG)gfortran      %{model}
    CC_VERSION_OPTION  = -v
    CXX_VERSION_OPTION = -v
    FC_VERSION_OPTION  = -v
    sw_base_ptrsize = 64-bit

#--------- Optimization (swept by run_sweep.sh) -------------------------------
default=base:
    OPTIMIZE     = -g %{optflag} -march=native
    EXTRA_FFLAGS = -fallow-argument-mismatch

default=peak:
    basepeak = yes

intrate,intspeed,fprate,fpspeed:   # required selector line
    hw_vendor    = Local
    tester       = maap
    test_sponsor = Local
    license_num  = 0
