# This sample PCRAM cell configuration is generated from the following paper:
# Architecting Phase Change Memory as a Scalable DRAM Alternative
# Proceedings of International symposium on Computer architecture, 2009

# Basic Cell Properties
MemCellType: PCRAM
ProcessNode: 90
Area: 9
AspectRatio: 1

# Resistance Values
Resistance:
  On: 1 KOhm
  Off: 1 MOhm

# Read Operation
Read:
  Mode: voltage
  Current: 40 uA
  # Energy_pJ: 2  (not read by msxac)

# Reset Operation
Reset:
  Mode: current
  Current: 300 uA
  Pulse: 40 ns

# Set Operation
Set:
  Mode: current
  Current: 150 uA
  Pulse: 150 ns

# Access Device
Access:
  Type: CMOS
  VoltageDrop: 0.3 V
  Width: 2
